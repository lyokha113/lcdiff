[workspace]
members = ["crates/lcdiff-core", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.3.13"

[workspace.dependencies]
cap-std = "4.0.2"
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
same-file = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
